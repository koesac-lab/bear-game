<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0e2031"><link rel="stylesheet" href="/style.css"><title>Fat Bear · communal screen</title><style>.share{display:flex;gap:12px;align-items:center}.share img{width:145px;height:145px;background:#fff;border:7px solid white;border-radius:9px;flex:none}.share img[hidden]{display:none}.share input{background:#153447;color:var(--text);border:1px solid #809daa;border-radius:8px;padding:7px;width:100%;max-width:270px}.share a{display:block;font-size:.84rem;font-weight:900;word-break:break-all}.share label{font-size:.8rem;color:var(--muted)}.share small{color:var(--gold);font-size:.75rem}.share small:not(:empty){display:block;padding:7px;background:#60422d;border-radius:7px}.header{display:flex;justify-content:space-between;align-items:center;gap:13px;padding:10px 0}.intro{display:flex;align-items:end;justify-content:space-between;gap:12px}.intro h1{font-size:clamp(2.4rem,4.5vw,4.7rem);letter-spacing:-.08em;line-height:.9;margin:18px 0}.intro h1 em{font-style:normal;color:var(--lime)}.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.82fr);gap:12px}.screen-bear .bear-body p{font-size:clamp(.77rem,1.05vw,1rem)}.screen-bear .photo{aspect-ratio:1.52}.roster{margin-top:12px}.lobby{text-align:center;padding:35px 15px}.lobby h2{font-size:clamp(3rem,6vw,6rem)}@media(max-width:880px){.layout{grid-template-columns:1fr}}@media(max-width:590px){.header{display:block}.share{margin:10px 0}.share img{width:110px;height:110px}.intro{display:block}}</style></head><body><header class="top wrap header"><span class="logo">FAT BEAR / SHARED SCREEN</span><a class="btn" href="/photos">View all 16 photos ↗</a><div class="share"><div><div class="status">Join this game</div><label for="wifi">Wi-Fi name (enter once):</label><input id="wifi" maxlength="64" placeholder="House Wi-Fi name" autocomplete="off"><a id="link" href="/">Loading URL…</a><small id="qr-error" role="status" aria-live="polite"></small></div><img id="qr" alt="Scan to join this game"></div></header><main class="wrap"><div class="intro"><h1>Our <em>fat bear</em> bracket.</h1><div class="status" id="clock" role="status" aria-live="polite">Connecting…</div></div><section class="panel lobby" id="lobby" hidden></section><div id="game" hidden><div class="layout"><section class="panel" id="current"></section><aside class="panel"><div class="status">Family leaderboard</div><h2>Who’s winning?</h2><div id="scores"></div><h2>Who’s voted?</h2><div id="roster" class="people roster"></div></aside></div><section class="panel"><h2>Overall bracket</h2><div id="bracket" class="bracket"></div></section><p class="small muted" id="photo-count"></p></div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let s=null,profiles=null,last='',matchKey='',alternate=false,polling=false,failures=0,qrReady=false,qrFailed=false,serverOffset=0;const wifi=$('wifi');wifi.value=localStorage.getItem('fatbear-wifi-name')||'';wifi.addEventListener('input',()=>localStorage.setItem('fatbear-wifi-name',wifi.value.trim()));$('link').href=location.origin+'/';$('link').textContent=location.origin+'/';$('qr').addEventListener('load',()=>{qrReady=true;updateReadiness()});$('qr').addEventListener('error',()=>{qrFailed=true;updateReadiness();$('qr').hidden=true;$('qr-error').textContent='QR not available: on iSH run sh setup.sh, then restart. Check /join-qr.svg for the exact error.'});if(['localhost','127.0.0.1'].includes(location.hostname)){$('qr').hidden=true;qrFailed=true;$('qr-error').textContent='Open /display by the iPhone Wi-Fi IP, not localhost, to show a join QR.'}else $('qr').src=location.origin+'/join-qr.svg';document.addEventListener('error',e=>{let img=e.target;if(!(img instanceof HTMLImageElement)||img.id==='qr')return;if(img.dataset.kind==='extra'){img.dataset.kind='grid';img.classList.add('grid-photo');img.style.setProperty('--origin',img.dataset.pos);img.src='/media/'+img.dataset.grid+'.jpg';return}img.classList.add('failed')},true);function photo(id){let p=s.profiles[id],graphic=p.extra_label.includes('graphic'),grid=alternate?!graphic:graphic;return `<div class="photo"><img src="/media/${grid?p.grid:'b'+id}.jpg" data-kind="${grid?'grid':'extra'}" data-grid="${p.grid}" data-pos="${p.position}" style="--origin:${p.position}" class="${grid?'grid-photo':''}" alt="${esc(p.name)} photo"><span class="fallback">#${esc(id)}</span></div>`}function card(id,g){let p=s.profiles[id];return `<article data-card-id="${id}" class="bear screen-bear ${g.status==='revealed'&&g.winner===id?'winner':''}">${photo(id)}<div class="bear-body"><h3>${esc(p.name)}</h3><p>${esc(p.lead)}</p><div class="status">${alternate?'Alternate image':'2026 contender'}</div></div></article>`}function clock(){let g=s.games[s.cursor],t=s.deadline||s.transition_at,n=t?Math.max(0,Math.ceil(t-(Date.now()/1000+serverOffset))):0;return g.status==='open'?`${g.voted}/${s.roster} voted · ${n}s left`:g.status==='locked'?`Reveal in ${n}s`:g.status==='revealed'?g.id===14?'Tournament complete':`Next match in ${n}s`:'Waiting'}function render(){if(!s)return;$('lobby').hidden=s.started;$('game').hidden=!s.started;$('photo-count').textContent=`${s.photos_cached}/${s.photos_total} photo sources cached on this iPhone. Open View all 16 photos to inspect each.`;if(!s.started){$('clock').textContent='Lobby';$('lobby').innerHTML=`<div class="status">Waiting for the family</div><h2>${s.joined} / ${s.expected}</h2><p>Scan the join code on each player’s phone. First match opens automatically when all have joined.</p><div id="readiness" class="small" role="status"></div><div class="people">${s.players.map(p=>`<span>${esc(p.name)}</span>`).join('')}</div>`;updateReadiness();return}let g=s.games[s.cursor];$('clock').textContent=clock();let result=g.status==='revealed'?g.official?`<div class="result"><strong>Official winner: ${esc(s.profiles[g.winner].name)}</strong><small>Official votes ${g.totals[0].toLocaleString()} vs ${g.totals[1].toLocaleString()} · family ${g.family_votes[g.a]} vs ${g.family_votes[g.b]}</small></div>`:`<div class="result pred"><strong>Family prediction: ${esc(s.profiles[g.winner].name)}</strong><small>${g.coin_toss?'Tied family vote settled by coin toss.':'Family majority advances.'} Official result not yet known.</small></div>`:`<div class="result pred">Picks stay private until reveal.</div>`;$('current').innerHTML=`<div class="status">${['Opening round','Quarterfinal','Final Four prediction','Championship prediction'][g.round]} · match ${g.id+1}/15</div><h2>${esc(s.profiles[g.a].name)} vs ${esc(s.profiles[g.b].name)}</h2><div class="pair">${card(g.a,g)}${card(g.b,g)}</div>${result}`;let sorted=[...s.players].sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name)),icons={correct:'✓',wrong:'✕',missed:'○',prediction:'◇',pending:'–',none:'–'};$('scores').innerHTML=`<table class="score"><thead><tr><th>Player</th><th>Points</th></tr></thead><tbody>${sorted.map((p,i)=>`<tr class="${i===0?'leader':''}"><td>${esc(p.name)}<div class="marks">${p.history.map((item,j)=>s.games[j].status==='revealed'?`<span class="${item==='correct'?'good':item==='wrong'?'bad':''}" title="Match ${j+1}: ${item}">${icons[item]}</span>`:'').join('')}</div></td><td>${p.score}</td></tr>`).join('');let round=['Opening 8','Quarterfinals','Final Four','Championship'];$('bracket').innerHTML=round.map((name,r)=>`<div class="round"><h3>${name}</h3>${s.games.filter(x=>x.round===r).map(x=>`<div class="mini ${x.status==='revealed'?'done':x.status==='open'?'live':''}">${x.a&&x.b?`${esc(s.profiles[x.a].name)} vs ${esc(s.profiles[x.b].name)}`:'Awaiting results'}<small>${x.status==='revealed'?(x.official?'Actual: ':'Family: ')+esc(s.profiles[x.winner].name):x.status==='hidden'?'Not unlocked':x.status==='open'?'Voting now':x.status==='locked'?'Reveal coming':'Upcoming'}</small></div>`).join('')}</div>`).join('')}function updateReadiness(){let el=$('readiness');if(!el||!s)return;let qr=qrReady?'Join QR ready':qrFailed?'Join QR unavailable; use the displayed URL':'Checking join QR…';el.textContent=`${qr} · Photos: ${s.photos_cached}/${s.photos_total} cached${s.photos_cached<s.photos_total?' — some images may be missing':''}. Open View all 16 photos to inspect them.`}function updatePhotos(){if(!s||!s.started)return;$('current').querySelectorAll('[data-card-id]').forEach(card=>{let id=card.dataset.cardId,p=s.profiles[id],graphic=p.extra_label.includes('graphic'),grid=alternate?!graphic:graphic,img=card.querySelector('img');if(!img)return;img.dataset.kind=grid?'grid':'extra';img.classList.toggle('grid-photo',grid);img.classList.remove('failed');img.src='/media/'+(grid?p.grid:'b'+id)+'.jpg';card.querySelector('.bear-body .status').textContent=alternate?'Alternate image':'2026 contender'})}function refresh(){let g=s.games[s.cursor];$('clock').textContent=clock();$('photo-count').textContent=`${s.photos_cached}/${s.photos_total} photo sources cached on this iPhone. Open View all 16 photos to inspect each.`;let result=g.status==='revealed'?g.official?`<div class="result"><strong>Official winner: ${esc(s.profiles[g.winner].name)}</strong><small>Official votes ${g.totals[0].toLocaleString()} vs ${g.totals[1].toLocaleString()} · family ${g.family_votes[g.a]} vs ${g.family_votes[g.b]}</small></div>`:`<div class="result pred"><strong>Family prediction: ${esc(s.profiles[g.winner].name)}</strong><small>${g.coin_toss?'Tied family vote settled by coin toss.':'Family majority advances.'} Official result not yet known.</small></div>`:`<div class="result pred">Picks stay private until reveal.</div>`;$('current').querySelector('.result').outerHTML=result;$('current').querySelectorAll('[data-card-id]').forEach(card=>card.classList.toggle('winner',g.status==='revealed'&&g.winner===card.dataset.cardId));let sorted=[...s.players].sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name)),icons={correct:'✓',wrong:'✕',missed:'○',prediction:'◇',pending:'–',none:'–'};$('scores').innerHTML=`<table class="score"><thead><tr><th>Player</th><th>Points</th></tr></thead><tbody>${sorted.map((p,i)=>`<tr class="${i===0?'leader':''}"><td>${esc(p.name)}<div class="marks">${p.history.map((item,j)=>s.games[j].status==='revealed'?`<span class="${item==='correct'?'good':item==='wrong'?'bad':''}" title="Match ${j+1}: ${item}">${icons[item]}</span>`:'').join('')}</div></td><td>${p.score}</td></tr>`).join('');let round=['Opening 8','Quarterfinals','Final Four','Championship'];$('bracket').innerHTML=round.map((name,r)=>`<div class="round"><h3>${name}</h3>${s.games.filter(x=>x.round===r).map(x=>`<div class="mini ${x.status==='revealed'?'done':x.status==='open'?'live':''}">${x.a&&x.b?`${esc(s.profiles[x.a].name)} vs ${esc(s.profiles[x.b].name)}`:'Awaiting results'}<small>${x.status==='revealed'?(x.official?'Actual: ':'Family: ')+esc(s.profiles[x.winner].name):x.status==='hidden'?'Not unlocked':x.status==='open'?'Voting now':x.status==='locked'?'Reveal coming':'Upcoming'}</small></div>`).join('');async function poll(){if(polling)return;polling=true;try{if(!profiles){let p=await fetch('/api/profiles');if(!p.ok)throw Error('Profiles unavailable');profiles=await p.json()}let r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw Error('State unavailable');let latest=await r.json(),stamp=JSON.stringify({games:latest.games,players:latest.players,cursor:latest.cursor,expected:latest.expected,joined:latest.joined,roster:latest.roster,started:latest.started,deadline:latest.deadline,transition_at:latest.transition_at,photos_cached:latest.photos_cached}),previousMatch=matchKey;serverOffset=latest.now-Date.now()/1000;latest.profiles=profiles;s=latest;matchKey=s.started?s.cursor+':'+s.games[s.cursor].a+':'+s.games[s.cursor].b:'';failures=0;if(stamp!==last){last=stamp;if(previousMatch!==matchKey||!s.started||!$('current').querySelector('.pair'))render();else refresh()}else if(s.started)$('clock').textContent=clock()}catch(e){failures++;if(failures>=2)$('clock').textContent='Reconnecting… Game still shown.'}finally{polling=false}}setInterval(()=>{if(s&&s.started){alternate=!alternate;updatePhotos()}},9000);poll();setInterval(poll,1100)})();
</script></body></html>
