<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0e2031"><link rel="stylesheet" href="/style.css"><title>Fat Bear · communal screen</title><style>.share{display:flex;gap:12px;align-items:center}.share img{width:145px;height:145px;background:#fff;border:7px solid white;border-radius:9px;flex:none}.share img[hidden]{display:none}.share input{background:#153447;color:var(--text);border:1px solid #809daa;border-radius:8px;padding:7px;width:100%;max-width:270px}.share a{display:block;font-size:.84rem;font-weight:900;word-break:break-all}.share label{font-size:.8rem;color:var(--muted)}.share small{color:var(--gold);font-size:.75rem}.share small:not(:empty){display:block;padding:7px;background:#60422d;border-radius:7px}.header{display:flex;justify-content:space-between;align-items:center;gap:13px;padding:10px 0}.intro{display:flex;align-items:end;justify-content:space-between;gap:12px}.intro h1{font-size:clamp(2.4rem,4.5vw,4.7rem);letter-spacing:-.08em;line-height:.9;margin:18px 0}.intro h1 em{font-style:normal;color:var(--lime)}.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.82fr);gap:12px}.screen-bear .bear-body p{font-size:clamp(.77rem,1.05vw,1rem)}.screen-bear .photo{aspect-ratio:1.52}.roster{margin-top:12px}.lobby{text-align:center;padding:35px 15px}.lobby h2{font-size:clamp(3rem,6vw,6rem)}@media(max-width:880px){.layout{grid-template-columns:1fr}}@media(max-width:590px){.header{display:block}.share{margin:10px 0}.share img{width:110px;height:110px}.intro{display:block}}</style></head><body><header class="top wrap header"><span class="logo">FAT BEAR / SHARED SCREEN</span><a class="btn" href="/photos">View all 16 photos ↗</a><div class="share"><div><div class="status">Join this game</div><label for="wifi">Wi-Fi name (enter once):</label><input id="wifi" maxlength="64" placeholder="House Wi-Fi name" autocomplete="off"><a id="link" href="/">Loading URL…</a><small id="qr-error" role="status" aria-live="polite"></small></div><img id="qr" alt="Scan to join this game"></div></header><main class="wrap"><div class="intro"><h1>Our <em>fat bear</em> bracket.</h1><div class="status" id="clock" role="status" aria-live="polite">Connecting…</div></div><section class="panel lobby" id="lobby" hidden></section><div id="game" hidden><div class="layout"><section class="panel" id="current"></section><aside class="panel"><div class="status">Family leaderboard</div><h2>Who’s winning?</h2><div id="scores"></div><h2>Who’s voted?</h2><div id="roster" class="people roster"></div></aside></div><section class="panel"><h2>Overall bracket</h2><div id="bracket" class="bracket"></div></section><p class="small muted" id="photo-count"></p></div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let s=null,profiles=null,revision=null,matchKey='',scoreKey='',bracketKey='',lobbyKey='',busy=false,failures=0,qrReady=false,qrFailed=false,serverOffset=0,pollTimer=0,countdownTimer=0;const wifi=$('wifi');wifi.value=localStorage.getItem('fatbear-wifi-name')||'';wifi.addEventListener('input',()=>localStorage.setItem('fatbear-wifi-name',wifi.value.trim()));$('link').href=location.origin+'/';$('link').textContent=location.origin+'/';$('qr').addEventListener('load',()=>{qrReady=true;readiness()});$('qr').addEventListener('error',()=>{qrFailed=true;$('qr').hidden=true;$('qr-error').textContent='QR unavailable: run sh setup.sh and check /join-qr.svg.';readiness()});if(['localhost','127.0.0.1'].includes(location.hostname)){$('qr').hidden=true;qrFailed=true;$('qr-error').textContent='Open /display using the iPhone Wi-Fi IP, not localhost.'}else $('qr').src=location.origin+'/join-qr.svg';document.addEventListener('error',e=>{const img=e.target;if(!(img instanceof HTMLImageElement)||img.id==='qr')return;if(img.dataset.kind==='extra'){img.dataset.kind='grid';img.classList.add('grid-photo');img.src='/media/'+img.dataset.grid+'.jpg'}else img.classList.add('failed')},true);function image(id){const p=profiles[id],grid=p.extra_label.includes('graphic');return `<div class="photo"><img src="/media/${grid?p.grid:'b'+id}.jpg" data-kind="${grid?'grid':'extra'}" data-grid="${p.grid}" class="${grid?'grid-photo':''}" style="--origin:${p.position}" alt="${esc(p.name)} photo"><span class="fallback">#${esc(id)}</span></div>`}function card(id){const p=profiles[id];return `<article data-card-id="${id}" class="bear screen-bear">${image(id)}<div class="bear-body"><h3>${esc(p.name)}</h3><p>${esc(p.lead)}</p><div class="status image-label">2026 contender</div></div></article>`}function clock(){if(!s||!s.started)return 'Lobby';const g=s.games[s.cursor],t=s.deadline||s.transition_at,n=t?Math.max(0,Math.ceil(t-(Date.now()/1000+serverOffset))):0;return g.status==='open'?`${g.voted}/${s.roster} voted · ${n}s left`:g.status==='locked'?`Reveal in ${n}s`:g.status==='revealed'?g.id===14?'Tournament complete':`Next match in ${n}s`:'Waiting'}function updateClock(){if(s)$('clock').textContent=clock()}function startCountdown(){clearInterval(countdownTimer);countdownTimer=setInterval(updateClock,1000);updateClock()}function readiness(){const el=$('readiness');if(!el||!s)return;el.textContent=`${qrReady?'Join QR ready':qrFailed?'Join QR unavailable; use the URL':'Checking join QR…'} · Photos: ${s.photos_cached}/${s.photos_total} cached${s.photos_cached<s.photos_total?' — some may be missing':''}. Open View all 16 photos to inspect them.`}function result(g){if(g.status!=='revealed')return '<div class="result pred">Picks stay private until reveal.</div>';const name=esc(profiles[g.winner].name);return g.official?`<div class="result"><strong>Official winner: ${name}</strong><small>Official votes ${g.totals[0].toLocaleString()} vs ${g.totals[1].toLocaleString()} · family ${g.family_votes[g.a]} vs ${g.family_votes[g.b]}</small></div>`:`<div class="result pred"><strong>Family prediction: ${name}</strong><small>${g.coin_toss?'Tied family vote settled by coin toss.':'Family majority advances.'} Official result not yet known.</small></div>`}function standings(){const icons={correct:'✓',wrong:'✕',missed:'○',prediction:'◇'},sorted=[...s.players].sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name));$('scores').innerHTML=`<table class="score"><thead><tr><th>Player</th><th>Points</th></tr></thead><tbody>${sorted.map((p,i)=>`<tr class="${i===0?'leader':''}"><td>${esc(p.name)}<div class="marks">${p.history.map((item,j)=>s.games[j].status==='revealed'?`<span class="${item==='correct'?'good':item==='wrong'?'bad':''}" title="Match ${j+1}: ${esc(item)}">${icons[item]||'–'}</span>`:'').join('')}</div></td><td>${p.score}</td></tr>`).join('')}</tbody></table>`;$('roster').innerHTML=s.players.map(p=>`<span class="${p.voted?'yes':''}">${esc(p.name)} ${p.voted?'✓':'·'}</span>`).join('')}function bracket(){const rounds=['Opening 8','Quarterfinals','Final Four','Championship'];$('bracket').innerHTML=rounds.map((name,r)=>`<div class="round"><h3>${name}</h3>${s.games.filter(g=>g.round===r).map(g=>`<div class="mini ${g.status==='revealed'?'done':g.status==='open'?'live':''}">${g.a&&g.b?`${esc(profiles[g.a].name)} vs ${esc(profiles[g.b].name)}`:'Awaiting results'}<small>${g.status==='revealed'?(g.official?'Actual: ':'Family: ')+esc(profiles[g.winner].name):g.status==='hidden'?'Not unlocked':g.status==='open'?'Voting now':g.status==='locked'?'Reveal coming':'Upcoming'}</small></div>`).join('')}</div>`).join('')}function renderCurrent(){if(!s.started)return;const g=s.games[s.cursor],key=s.phase||s.cursor+':'+g.status+':'+g.a+':'+g.b;if(key!==matchKey||!$('current').querySelector('.pair')){$('current').innerHTML=`<div class="status">${['Opening round','Quarterfinal','Final Four prediction','Championship prediction'][g.round]} · match ${g.id+1}/15</div><h2>${esc(profiles[g.a].name)} vs ${esc(profiles[g.b].name)}</h2><div class="pair">${card(g.a)}${card(g.b)}</div><div id="outcome"></div>`;matchKey=key}$('outcome').innerHTML=result(g);$('current').querySelectorAll('[data-card-id]').forEach(el=>el.classList.toggle('winner',g.status==='revealed'&&g.winner===el.dataset.cardId));$('photo-count').textContent=`${s.photos_cached}/${s.photos_total} photo sources cached on this iPhone. Open View all 16 photos to inspect each.`}function render(){if(!s)return;$('lobby').hidden=s.started;$('game').hidden=!s.started;if(!s.started){const key=JSON.stringify([s.joined,s.expected,s.players,s.photos_cached,s.photos_total]);if(key!==lobbyKey){lobbyKey=key;$('lobby').innerHTML=`<div class="status">Waiting for the family</div><h2>${s.joined} / ${s.expected}</h2><p>Scan the join code on each player’s phone. First match opens automatically when all have joined.</p><div id="readiness" class="small" role="status"></div><div class="people">${s.players.map(p=>`<span>${esc(p.name)}</span>`).join('')}</div>`;readiness()}updateClock();return}renderCurrent();const nextScoreKey=JSON.stringify(s.players);if(nextScoreKey!==scoreKey){scoreKey=nextScoreKey;standings()}const nextBracketKey=JSON.stringify(s.games);if(nextBracketKey!==bracketKey){bracketKey=nextBracketKey;bracket()}updateClock()}function schedule(){clearTimeout(pollTimer);if(document.hidden)return;const active=s&&s.started&&s.games[s.cursor]&&s.games[s.cursor].status!=='revealed';pollTimer=setTimeout(poll,active?2500:8000)}async function poll(){if(busy||document.hidden)return;busy=true;try{if(!profiles){const r=await fetch('/api/profiles');if(!r.ok)throw Error('Profiles unavailable');profiles=await r.json()}const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw Error('State unavailable');const next=await r.json();serverOffset=next.now-Date.now()/1000;const changed=revision!==next.revision||!s;revision=next.revision;s=next;failures=0;if(changed)render();else updateClock()}catch(e){if(++failures>=2)$('clock').textContent='Reconnecting… Game still shown.'}finally{busy=false;schedule()}}document.addEventListener('visibilitychange',()=>{if(!document.hidden){poll();startCountdown()}else{clearTimeout(pollTimer)}});startCountdown();poll()})();
</script></body></html>
